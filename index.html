<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mini Cab Receipt</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#163a56;font-family:Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;background:#1565c0;color:#fff;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px}.tab{border:0;background:#dce9f7;color:#164d7d;padding:9px 12px;border-radius:8px;font-weight:700}.tab.active{background:#fff}
.page{padding:12px;max-width:950px;margin:auto}.panel{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
label{font-size:12px;font-weight:700}input,select{width:100%;padding:9px;border:1px solid #bcc8d4;border-radius:6px;margin-top:4px;font-size:14px}
button.action{border:0;border-radius:8px;padding:11px 13px;font-weight:700;background:#1565c0;color:#fff;margin:4px 4px 0 0}
button.light{background:#e9f0f7;color:#155281}
.hidden{display:none!important}
.receipt{background:#fff;border:1px solid #111;padding:10px;color:#27445b;max-width:820px;margin:auto}
.rtop{display:grid;grid-template-columns:38% 62%;min-height:260px;border-bottom:1px solid #111}
.logo{display:flex;align-items:flex-start;justify-content:center;padding:8px 0}.logo img{width:245px;max-width:100%;object-fit:contain}
.info{padding:14px 10px;font-size:14px}.info .brand{font-size:23px;font-weight:800;color:#063fbe;font-style:italic;text-align:center;margin:22px 0 8px}
.info div{margin:7px 0}.right{text-align:right}.blue{color:#2b638e}
.center-title{font-size:24px;text-align:center;color:#3a78a7;font-weight:800;padding:5px 0}
.section{border-top:1px solid #111;padding:8px 6px}.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}.row b{font-weight:800}.route{border:1px dashed #222;padding:4px}.total{font-size:23px;color:#125a8f;font-weight:900}.sign{text-align:right;margin-top:35px}.qr{text-align:left}.qr img{width:130px}
.history-item{border:1px solid #d4dce4;border-radius:8px;padding:10px;margin:8px 0}.history-item b{color:#1565c0}
@media(max-width:680px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.rtop{grid-template-columns:1fr;min-height:0}.logo{padding-bottom:0}.info .brand{margin:5px 0}.receipt{font-size:12px}.info{font-size:12px}.total{font-size:19px}}
@media print{.top,.no-print{display:none!important}body,.page{background:#fff;padding:0}.panel{box-shadow:none;padding:0}.receipt{border:1px solid #111;max-width:none}}
</style>
</head>
<body>
<div class="top">
  <span>🚕 Mini Cab Receipt v2</span>
  <div class="tabs"><button class="tab active" onclick="showTab('new',this)">New</button><button class="tab" onclick="showTab('history',this)">History</button></div>
</div>
<div class="page">
<section id="new">
<div class="panel no-print">
<h3>Receipt Details</h3>
<div class="grid">
<label>Invoice No.<input id="invoice" value="145"></label>
<label>Date<input id="date" type="date"></label>
<label>Time<input id="time" type="time" value="13:30"></label>
<label>Customer Name<input id="customer" value="RASHMI PARIDA"></label>
<label>Customer Number<input id="customerNo" value="918270225221"></label>
<label>Driver Name<input id="driver" value="MUNA"></label>
<label>Vehicle Number<input id="vehicle" value="OD 33AN1760"></label>
<label>Vehicle Type<input id="vehicleType" value="Wagner VXI"></label>
<label class="full">Pickup Location<input id="pickup" value="AHALYA NAGAR PATIA, SHANTI STUPA"></label>
<label class="full">Drop Location<input id="drop" value="BBI AIR PORT"></label>
<label>From Date/Time<input id="from" type="datetime-local"></label>
<label>To Date/Time<input id="to" type="datetime-local"></label>
<label>Distance (KM)<input id="km" type="number" value="60"></label>
<label>Trip Charges (₹)<input id="trip" type="number" value="840"></label>
<label>Day Charges (₹)<input id="day" type="number" value="360"></label>
<label>Night Charges (₹)<input id="night" type="number" value="0"></label>
<label>Toll Tax (₹)<input id="toll" type="number" value="0"></label>
<label>Parking (₹)<input id="parking" type="number" value="0"></label>
<label>Discount (₹)<input id="discount" type="number" value="0"></label>
<label>Payment Type<select id="payment"><option>Cash</option><option>UPI</option><option>Card</option><option>Other</option></select></label>
<label class="full">Notes<input id="notes" value="Thank you for ride"></label>
</div>
<button class="action" onclick="generate()">Generate</button>
<button class="action light" onclick="saveReceipt()">Save to History</button>
<button class="action light" onclick="window.print()">Print / Save PDF</button>
<button class="action light" onclick="shareReceipt()">Share</button>
</div>
<div class="panel"><div id="receipt" class="receipt"></div></div>
</section>

<section id="history" class="hidden">
<div class="panel"><h3>Receipt History</h3><button class="action light" onclick="clearHistory()">Clear All History</button><div id="historyList"></div></div>
</section>
</div>

<script>
const ids=['invoice','date','time','customer','customerNo','driver','vehicle','vehicleType','pickup','drop','from','to','km','trip','day','night','toll','parking','discount','payment','notes'];
const $=id=>document.getElementById(id), money=v=>'₹ '+Number(v||0).toFixed(2);
function val(id){return $(id).value}
function data(){let o={};ids.forEach(id=>o[id]=val(id));return o}
function money2(n){return money(n)}
function render(d){
 let total=['trip','day','night','toll','parking'].reduce((s,id)=>s+Number(d[id]||0),0)-Number(d.discount||0);
 $('receipt').innerHTML=`
 <div class="rtop"><div class="logo"><img src="logo.png"></div><div class="info">
 <div><b>In voice No.:</b> ${d.invoice}<span class="right"><b>${d.date}</b> &nbsp; ${d.time}</span></div>
 <div class="brand">ONLINE MINI CAB SERVICE</div><div class="right">Ph-9010903394</div>
 <div class="right">munnatiria@gmail.com</div><div class="right">Ahalya Nagar, Patia, Bhubaneswar, Odisha</div><div class="right">751024</div></div></div>
 <div class="center-title">Here's your receipt for your round trip ,</div>
 <div class="section"><div class="row"><b>Customer Name :</b><b>${d.customer}</b></div><div class="row"><b>Customer Number :</b><b>${d.customerNo}</b></div></div>
 <div class="section"><div class="row"><b>Pickup location</b><b>${d.pickup}</b></div><div class="row"><b>Drop location</b><b>${d.drop}</b></div></div>
 <div class="section"><div class="row"><span>Driver Name :</span><b>${d.driver}</b></div><div class="row"><span>Vehicle Number :</span><b>${d.vehicle}</b></div><div class="row"><span>Vehicle type</span><b>${d.vehicleType}</b></div><div class="row"><span>From Date :</span><b>${d.from}</b></div><div class="row"><span>To Date :</span><b>${d.to}</b></div></div>
 <div class="section"><div class="row"><span>Distance (KM)</span><b>Km : ${d.km}</b></div>
 <div class="row"><span>Trip charges</span><b>${money2(d.trip)}</b></div><div class="row"><span>Day charges (Hrs)</span><b>${money2(d.day)}</b></div>
 <div class="row"><span>Night charges</span><b>${money2(d.night)}</b></div><div class="row"><span>Toll tax</span><b>${money2(d.toll)}</b></div>
 <div class="row"><span>Parking charges</span><b>${money2(d.parking)}</b></div><div class="row"><span>Discount</span><b>${money2(d.discount)}</b></div></div>
 <div class="section"><div class="row"><b>Payment type</b><b>${d.payment}</b></div><div class="row total"><span>Totall Amount</span><span>${money2(total)}</span></div>
 <div class="small">${d.notes}</div><div class="qr"><img src="qr.png"></div><div class="sign"><b>Authorized signature</b></div></div>`;
 return total;
}
function generate(){render(data())}
function saveReceipt(){
 let d=data(); let total=render(d); d.total=total; d.savedAt=new Date().toLocaleString(); let h=JSON.parse(localStorage.getItem('cabReceipts')||'[]'); h.unshift(d); localStorage.setItem('cabReceipts',JSON.stringify(h)); renderHistory(); alert('Receipt saved to history.')}
function renderHistory(){
 let h=JSON.parse(localStorage.getItem('cabReceipts')||'[]');
 $('historyList').innerHTML=h.length?h.map((d,i)=>`<div class="history-item"><b>#${d.invoice}</b> — ${d.customer}<br>${d.date} ${d.time} · ${money(d.total)}<br><button class="action light" onclick="loadHistory(${i})">Open</button> <button class="action light" onclick="deleteHistory(${i})">Delete</button></div>`).join(''):'No saved receipts yet.';
}
function loadHistory(i){let h=JSON.parse(localStorage.getItem('cabReceipts')||'[]'),d=h[i];ids.forEach(id=>{if(d[id]!==undefined)$(id).value=d[id]});render(d);showTab('new',document.querySelector('.tab'))}
function deleteHistory(i){let h=JSON.parse(localStorage.getItem('cabReceipts')||'[]');h.splice(i,1);localStorage.setItem('cabReceipts',JSON.stringify(h));renderHistory()}
function clearHistory(){if(confirm('Delete all saved receipts?')){localStorage.removeItem('cabReceipts');renderHistory()}}
function showTab(name,btn){$('new').classList.toggle('hidden',name!=='new');$('history').classList.toggle('hidden',name!=='history');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(name==='history')renderHistory()}
async function shareReceipt(){if(navigator.share){await navigator.share({title:'Mini Cab Receipt',text:'Receipt #'+val('invoice')+' — '+val('customer')})}else alert('Use Print / Save PDF to share.')}
let now=new Date(), iso=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,16);$('date').value=now.toISOString().slice(0,10);$('from').value=iso;$('to').value=iso;generate();renderHistory();
</script>
</body>
</html>
